<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warkop 7</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-5 fw-bold text-primary">☕︎ Kasir Warkop 7</h1>

      <div id="halamanUtama">
        <div class="row">
          <div class="col-md-6">
            <div class="card shadow-sm mb-4">
              <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Daftar Menu</h4>
              </div>
              <div class="card-body">
                <div id="menu-area"></div>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card shadow-sm mb-4">
              <div class="card-header bg-success text-white">
                <h4 class="mb-0">Daftar Belanja</h4>
              </div>
              <div class="card-body">
                <div id="cart-area"></div>
              </div>
              <div class="card-footer">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="mb-0">Total</h5>
                  <h4 class="mb-0 text-success fw-bold" id="totalBayar">0 Rp</h4>
                </div>

                <div>
                  <button onclick="prosesCheckout()" class="btn btn-success w-100 btn-lg">Bayar Sekarang</button>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="halamanStruk" class="d-none">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card shadow">
              <div class="card-body text-center p-5">
                <h2 class="text-success fw-bold mb-4">✅Pembayaran Berhasil</h2>
                <h5 class="text-muted">Detail Pesanan Anda :</h5>
                <hr />
                <div id="detailPesanan" class="text-start mb-4"></div>
                <hr />
                <button onclick="pesananSelesai()" class="btn btn-primary w-100">Selesaikan & Buat Pesanan Baru</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
