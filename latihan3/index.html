<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>latihan 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
  </head>
  <body>
    <div class="container mt-3">
      <div class="row text-center">
        <h1>Latihan 3 - JavaScript Operator</h1>
      </div>
    </div>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-2">
          <div class="input-group">
            <input type="text" id="angka1" class="form-control" placeholder="Angka 1"/>
          </div>
        </div>

        <div class="col-2">
          <div class="input-group">
            <select id="operatorAritmatika" class="form-select">
              <option selected>Pilih Operator</option>
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">x</option>
              <option value="/">/</option>
              <option value="%">%</option>
            </select>
          </div>
        </div>

        <div class="col-2">
          <div class="input-group">
            <input type="number" id="angka2" class="form-control" placeholder="Angka 2"/>
          </div>
        </div>

        <div class="col-3">
          <button type="button" class="btn btn-primary" id="hasil-btn">Hasil Hitung</button>
          <span class="mx-4" id="hasil">Hasil</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
