<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>latihan 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
  </head>
  <body>
    <div class="container py-3">
      <h1 class="mb-5">Latihan 4 - Kalkulator</h1>

      <div class="mb-3">
        <label for="no-1" class="form-label">Angka Pertama</label>
        <input type="number" id="no1" class="form-control" />
      </div>

      <div class="mb-3">
        <label for="oprt" class="form-label">Operator</label>
        <input id="operation" class="form-control" placeholder="+ - x /" maxlength="1"/>
      </div>

      <div class="mb-3">
        <label for="no2" class="form-label">Angka Kedua</label>
        <input type="number" id="no2" class="form-control"/>
      </div>

      <button onclick="calculate()" class="btn btn-primary">Hitung</button>
      <p id="hasil" class="mt-3 fw-bold"></p>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
